name: Docs Check

on:
  pull_request:
    paths:
      - 'official-docs/**'
      - 'docs-py/**'
  push:
    branches: [main]
    paths:
      - 'official-docs/**'
      - 'docs-py/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: '3.12'

      - name: Install package
        run: uv sync --group dev

      # Restore fixture cache scoped to the current ref (branch or main) and version prefix (v3).
      # This ensures caches are never shared across unrelated branches or older versions.
      - name: Restore fixture cache
        id: mdx-fixtures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: fixtures.tar.gz
          key: mdx-fixtures-v3-${{ github.ref_name }}-run-${{ github.run_id }}
          restore-keys: |
            mdx-fixtures-v3-${{ github.ref_name }}-

      - name: Unpack fixtures
        run: |
          if [ -f fixtures.tar.gz ]; then
            mkdir -p .cache
            tar -C .cache -xzf fixtures.tar.gz
          fi

      - name: Check fixture cache age (2h TTL)
        id: cache-age
        run: |
          matched="${{ steps.mdx-fixtures.outputs.cache-matched-key }}"
          now=$(date +%s)
          if [ -n "$matched" ]; then
            epoch="${matched##*-}"
            age=$(( now - epoch ))
          else
            age=999999
          fi
          if [ "$age" -gt 7200 ]; then
            rm -rf .cache/mdx-html
            rm -f fixtures.tar.gz
            mkdir -p .cache/mdx-html
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
          echo "now=$now" >> "$GITHUB_OUTPUT"

      - name: Run MDX examples check
        run: |
          if [ "${{ steps.cache-age.outputs.fresh }}" == "true" ]; then
            uv run scripts/check_mdx_examples.py --skip-warm
          else
            uv run scripts/check_mdx_examples.py
          fi

      # always(): a run that fails validation still saved its warm fixtures,
      # so the next fix commit restores and validates fast instead of warming.
      - name: Package fixtures
        if: always() && steps.cache-age.outputs.fresh == 'false'
        run: |
          mkdir -p .cache/mdx-html
          if [ -n "$(ls -A .cache/mdx-html)" ]; then
            tar -C .cache -czf fixtures.tar.gz mdx-html
          else
            rm -f fixtures.tar.gz
          fi

      - name: Save fixture cache
        if: always() && steps.cache-age.outputs.fresh == 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: fixtures.tar.gz
          key: mdx-fixtures-v3-${{ github.ref_name }}-${{ steps.cache-age.outputs.now }}
