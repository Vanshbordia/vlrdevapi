name: Docs Check

on:
  pull_request:
    paths:
      - 'official-docs/**'
      - 'docs-py/**'
  push:
    branches: [main]
    paths:
      - 'official-docs/**'
      - 'docs-py/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

        with:
          python-version: '3.12'

      - name: Install package
        run: uv sync --group dev

      - name: Run MDX examples check
        run: uv run scripts/check_mdx_examples.py --live
        # --live: single validated pass, fresh vlr.gg data, in-run dedup only.
        # No persisted fixture cache in CI: GitHub's cache is scoped per
        # branch/PR and would validate against data from when a branch was
        # created — wrong by merge time. Fixtures stay a local-dev convenience.
