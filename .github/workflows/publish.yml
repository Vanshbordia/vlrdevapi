name: Publish to PyPI and MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'What to publish'
        required: true
        type: choice
        options:
          - 'all'
          - 'mcp-only'
          - 'pypi-only'
        default: 'all'

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    if: github.event_name == 'release' || inputs.target != 'mcp-only'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --all-extras

      - name: Download fixtures
        run: uv run python scripts/download_fixtures.py

      - name: Run tests
        run: uv run pytest

  pypi-publish:
    name: Publish to PyPI
    if: github.event_name == 'release' || inputs.target != 'mcp-only'
    runs-on: ubuntu-24.04
    needs:
      - test

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/vlrdevapi/

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  mcp-publish:
    name: Publish to MCP Registry
    if: always() && (github.event_name == 'release' || inputs.target != 'pypi-only') && (inputs.target == 'mcp-only' || needs.pypi-publish.result == 'success')
    runs-on: ubuntu-24.04
    needs:
      - pypi-publish

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Wait for PyPI propagation
        if: github.event_name == 'release' || inputs.target != 'mcp-only'
        run: sleep 15

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
